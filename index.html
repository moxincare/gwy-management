<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WaytoGWY 备考系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f2f5; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #ccc; padding-bottom: 8px; }
        .tab-btn { background: #e2e8f0; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }
        .tab-btn.active { background: #3b82f6; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: white; border-radius: 24px; padding: 1.2rem 1.5rem; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .row-flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
        button { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 16px; }
        .task-item, .mistake-item, .chengyu-item, .exam-item { background: #f8fafc; margin: 8px 0; padding: 10px; border-radius: 16px; }
        .small-note { font-size: 0.75rem; color: #64748b; margin-top: 8px; }
        canvas { max-height: 200px; width: 100%; }
        .sub-detail { display: none; margin-top: 12px; background: #eef2ff; padding: 10px; border-radius: 16px; }
        .lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#f0f2f5; display:flex; justify-content:center; align-items:center; z-index:10000; }
        .lock-card { background:white; border-radius:32px; padding:2rem; text-align:center; width:300px; }
        .quiz-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:10001; }
        .quiz-card { background:white; border-radius:32px; padding:24px; max-width:500px; width:90%; }
        .quiz-option { margin:12px 0; padding:10px; background:#f1f5f9; border-radius:40px; cursor:pointer; text-align:center; }
    </style>
</head>
<body>
<div id="lockScreen" class="lock-screen">
    <div class="lock-card">
        <h2>🔒 备考系统已加密</h2>
        <p>请输入密码</p>
        <input type="password" id="passwordInput" placeholder="密码">
        <button id="unlockBtn">解锁</button>
        <div id="lockError" class="small-note" style="color:red"></div>
        <div class="small-note">默认密码：gwy2026</div>
    </div>
</div>

<div id="mainContent" style="display:none;">
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-panel="exam">📊 套卷分析</button>
        <button class="tab-btn" data-panel="todo">✅ Todo计划</button>
        <button class="tab-btn" data-panel="mistake">📸 错题本</button>
        <button class="tab-btn" data-panel="chengyu">📖 成语</button>
        <button class="tab-btn" data-panel="module">📈 模块统计</button>
        <button class="tab-btn" data-panel="extra">⏰ 其他</button>
    </div>

    <!-- 套卷分析 -->
    <div id="examPanel" class="panel active">
        <div class="card">
            <h2>📊 套卷分析（支持小题型）</h2>
            <p>总平均正确率 <strong id="avgAccuracy">--</strong> %</p>
            <canvas id="examChart" height="180"></canvas>
            <div class="row-flex">
                <input type="text" id="examName" placeholder="套卷名称">
                <button id="showSubForm">📝 录入小题型</button>
            </div>
            <div id="subForm" style="display:none; background:#f8fafc; padding:12px; border-radius:20px;">
                <div id="subInputs"></div>
                <button id="submitExam">保存套卷</button>
                <button id="hideSubForm">取消</button>
            </div>
            <div id="examList"></div>
        </div>
    </div>

    <!-- Todo计划 -->
    <div id="todoPanel" class="panel">
        <div class="card">
            <h2>✅ Todo计划（计时+饼图）</h2>
            <div class="row-flex">
                <input type="text" id="taskName" placeholder="任务名称">
                <select id="taskSubject">
                    <option>言语理解</option><option>判断推理</option><option>资料分析</option>
                    <option>数量关系</option><option>政治理论</option><option>常识</option><option>申论</option>
                </select>
                <button id="addTask">添加</button>
            </div>
            <div id="todoList"></div>
            <hr>
            <div class="row-flex">
                <button id="todoToday">今日饼图</button>
                <button id="todoWeek">本周饼图</button>
                <button id="todoMonth">本月饼图</button>
            </div>
            <canvas id="todoPieChart" height="180"></canvas>
        </div>
    </div>

    <!-- 错题本 -->
    <div id="mistakePanel" class="panel">
        <div class="card">
            <h2>📸 错题本（OCR识别）</h2>
            <div class="row-flex">
                <input type="file" id="mistakePhoto" accept="image/*">
                <button id="ocrBtn">开始OCR</button>
            </div>
            <textarea id="ocrText" rows="2" placeholder="识别结果或手动输入"></textarea>
            <select id="mistakeCategory">
                <option>言语理解</option><option>判断推理</option><option>资料分析</option>
                <option>数量关系</option><option>政治理论</option><option>常识</option>
            </select>
            <input type="text" id="mistakeNote" placeholder="错误原因">
            <button id="addMistake">添加错题</button>
            <div id="mistakeList"></div>
        </div>
    </div>

    <!-- 成语 -->
    <div id="chengyuPanel" class="panel">
        <div class="card">
            <h2>📖 成语速查+测验</h2>
            <input type="text" id="chengyuSearch" placeholder="搜索成语" onkeyup="filterChengyu()">
            <div class="row-flex">
                <input type="text" id="newWord" placeholder="新成语">
                <input type="text" id="newMeaning" placeholder="释义">
                <button id="addChengyu">添加</button>
            </div>
            <div id="chengyuList"></div>
        </div>
    </div>

    <!-- 模块统计 -->
    <div id="modulePanel" class="panel">
        <div class="card">
            <h2>📈 六大模块刷题统计</h2>
            <div id="moduleOverview" class="row-flex" style="justify-content:space-between;"></div>
            <div class="row-flex">
                <input type="date" id="moduleDate">
                <button id="recordModule">记录今日数据</button>
            </div>
            <div id="moduleInputArea" style="display:none; background:#f8fafc; padding:12px; border-radius:20px;"></div>
            <div class="row-flex">
                <button id="moduleToday">今日饼图</button>
                <button id="moduleWeek">本周饼图</button>
                <button id="moduleMonth">本月饼图</button>
            </div>
            <canvas id="modulePieChart" height="180"></canvas>
            <canvas id="moduleLineChart" height="180"></canvas>
        </div>
    </div>

    <!-- 其他 -->
    <div id="extraPanel" class="panel">
        <div class="card">
            <h2>⏰ 倒计时 & 申论</h2>
            <div class="row-flex">
                <input type="text" id="examNameInput" placeholder="考试名称">
                <input type="date" id="examDate">
                <button id="addCountdown">添加倒计时</button>
            </div>
            <div id="countdownList"></div>
            <hr>
            <textarea id="myAnswer" rows="2" placeholder="你的申论答案"></textarea>
            <textarea id="refAnswer" rows="2" placeholder="参考答案"></textarea>
            <button id="compareAnswer">对比答案</button>
            <div id="compareResult" class="small-note"></div>
            <hr>
            <div id="courseList"></div>
        </div>
    </div>
</div>
</div>

<script>
    // 密码锁
    const PASSWORD = "gwy2026";
    document.getElementById('unlockBtn').onclick = function() {
        if (document.getElementById('passwordInput').value === PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initAll();
        } else {
            document.getElementById('lockError').innerText = '密码错误';
        }
    };
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('unlockBtn').click();
    });

    // ---------- 存储 ----------
    const STORAGE = {
        todos: 'todos',
        exams: 'exams_sub',
        mistakes: 'mistakes',
        chengyu: 'chengyu',
        modules: 'modules_data',
        countdowns: 'countdowns'
    };
    let todos = [], exams = [], mistakes = [], chengyuList = [], modulesData = [], countdowns = [];
    const MODULES = ["言语理解","判断推理","资料分析","数量关系","政治理论","常识"];

    function saveAll() {
        localStorage.setItem(STORAGE.todos, JSON.stringify(todos));
        localStorage.setItem(STORAGE.exams, JSON.stringify(exams));
        localStorage.setItem(STORAGE.mistakes, JSON.stringify(mistakes));
        localStorage.setItem(STORAGE.chengyu, JSON.stringify(chengyuList));
        localStorage.setItem(STORAGE.modules, JSON.stringify(modulesData));
        localStorage.setItem(STORAGE.countdowns, JSON.stringify(countdowns));
    }

    function loadData() {
        todos = JSON.parse(localStorage.getItem(STORAGE.todos)) || [];
        exams = JSON.parse(localStorage.getItem(STORAGE.exams)) || [];
        mistakes = JSON.parse(localStorage.getItem(STORAGE.mistakes)) || [];
        chengyuList = JSON.parse(localStorage.getItem(STORAGE.chengyu)) || [
            { word:"筚路蓝缕", meaning:"创业艰辛", review:3 },
            { word:"孜孜不倦", meaning:"勤奋", review:5 },
            { word:"举一反三", meaning:"类推", review:2 }
        ];
        modulesData = JSON.parse(localStorage.getItem(STORAGE.modules)) || [];
        countdowns = JSON.parse(localStorage.getItem(STORAGE.countdowns)) || [];
        // 兼容旧套卷
        exams = exams.map(exam => {
            if (!exam.sub) {
                let sub = {};
                MODULES.forEach(m => sub[m] = { c:0, t:0 });
                exam.sub = sub;
                exam.correct = exam.correct || 0;
                exam.total = exam.total || 0;
            }
            return exam;
        });
    }

    // 套卷模块
    let examChart = null;
    function updateExamUI() {
        let totalAcc = exams.length ? (exams.reduce((s,e)=> s + (e.correct/e.total)*100, 0)/exams.length).toFixed(1) : 0;
        document.getElementById('avgAccuracy').innerText = totalAcc;
        const labels = exams.map(e => e.name);
        const data = exams.map(e => (e.correct/e.total*100).toFixed(1));
        const ctx = document.getElementById('examChart').getContext('2d');
        if (examChart) examChart.destroy();
        examChart = new Chart(ctx, { type:'line', data:{ labels, datasets:[{ label:'正确率%', data }] } });
        renderExamList();
    }

    function renderExamList() {
        const container = document.getElementById('examList');
        container.innerHTML = exams.map((exam, idx) => {
            let acc = (exam.correct/exam.total*100).toFixed(1);
            return `<div class="exam-item" data-idx="${idx}">
                        <div class="row-flex" style="justify-content:space-between;">
                            <strong>${exam.name}</strong>
                            <span>总正确率 ${acc}% (${exam.correct}/${exam.total})</span>
                            <button class="editExam" data-idx="${idx}">编辑小题型</button>
                        </div>
                        <div class="sub-detail" id="subDetail-${idx}">
                            <table style="width:100%; border-collapse:collapse;">
                                <tr><th>题型</th><th>正确/总数</th><th>正确率</th></tr>
                                ${MODULES.map(mod => {
                                    let s = exam.sub[mod] || {c:0,t:0};
                                    let rate = s.t ? (s.c/s.t*100).toFixed(1) : '--';
                                    return `<tr><td>${mod}</td><td>${s.c}/${s.t}</td><td>${rate}%</td></tr>`;
                                }).join('')}
                            </table>
                        </div>
                    </div>`;
        }).join('');
        document.querySelectorAll('.exam-item').forEach(el => {
            el.onclick = (e) => {
                if (e.target.classList.contains('editExam')) return;
                let detail = el.querySelector('.sub-detail');
                if (detail) detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
            };
        });
        document.querySelectorAll('.editExam').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                let idx = parseInt(btn.dataset.idx);
                editExam(idx);
            };
        });
    }

    function editExam(idx) {
        let exam = exams[idx];
        document.getElementById('examName').value = exam.name;
        let inputsDiv = document.getElementById('subInputs');
        inputsDiv.innerHTML = MODULES.map(mod => `
            <div><strong>${mod}</strong></div>
            <div class="row-flex">
                <input type="number" id="edit_c_${mod}" placeholder="正确数" value="${exam.sub[mod]?.c || 0}" style="width:100px">
                <input type="number" id="edit_t_${mod}" placeholder="总题数" value="${exam.sub[mod]?.t || 0}" style="width:100px">
            </div>
        `).join('');
        document.getElementById('subForm').style.display = 'block';
        document.getElementById('submitExam').onclick = () => {
            let sub = {};
            let totalCorrect = 0, totalTotal = 0;
            for (let mod of MODULES) {
                let c = parseInt(document.getElementById(`edit_c_${mod}`).value) || 0;
                let t = parseInt(document.getElementById(`edit_t_${mod}`).value) || 0;
                sub[mod] = { c, t };
                totalCorrect += c;
                totalTotal += t;
            }
            if (totalTotal === 0) { alert('至少一个题型有题数'); return; }
            exam.sub = sub;
            exam.correct = totalCorrect;
            exam.total = totalTotal;
            saveAll();
            updateExamUI();
            document.getElementById('subForm').style.display = 'none';
        };
    }

    function showSubForm() {
        document.getElementById('examName').value = '';
        let inputsDiv = document.getElementById('subInputs');
        inputsDiv.innerHTML = MODULES.map(mod => `
            <div><strong>${mod}</strong></div>
            <div class="row-flex">
                <input type="number" id="new_c_${mod}" placeholder="正确数" style="width:100px">
                <input type="number" id="new_t_${mod}" placeholder="总题数" style="width:100px">
            </div>
        `).join('');
        document.getElementById('subForm').style.display = 'block';
        document.getElementById('submitExam').onclick = () => {
            let name = document.getElementById('examName').value.trim();
            if (!name) { alert('请输入套卷名称'); return; }
            let sub = {};
            let totalCorrect = 0, totalTotal = 0;
            for (let mod of MODULES) {
                let c = parseInt(document.getElementById(`new_c_${mod}`).value) || 0;
                let t = parseInt(document.getElementById(`new_t_${mod}`).value) || 0;
                sub[mod] = { c, t };
                totalCorrect += c;
                totalTotal += t;
            }
            if (totalTotal === 0) { alert('至少一个题型有题数'); return; }
            exams.push({ name, correct: totalCorrect, total: totalTotal, sub });
            saveAll();
            updateExamUI();
            document.getElementById('subForm').style.display = 'none';
        };
    }

    // Todo模块
    let activeTimer = null, currentTodoId = null;
    function renderTodos() {
        const container = document.getElementById('todoList');
        container.innerHTML = todos.map((t, idx) => `
            <div class="task-item">
                <div><b>${t.name}</b> (${t.subject}) ${t.completed ? '✅完成' : '⏳待办'}<br>专注: ${Math.floor((t.time||0)/60)}分${(t.time||0)%60}秒</div>
                <div class="row-flex">
                    ${!t.completed ? `<button class="startTimer" data-idx="${idx}">⏱️ 计时</button>` : ''}
                    ${!t.completed ? `<button class="completeTask" data-idx="${idx}">✔️完成</button>` : ''}
                    <button class="delTask" data-idx="${idx}">删除</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.startTimer').forEach(btn => {
            btn.onclick = () => {
                let idx = parseInt(btn.dataset.idx);
                if (activeTimer) clearInterval(activeTimer);
                currentTodoId = idx;
                let sec = 0;
                let span = document.createElement('span');
                span.className = 'small-note';
                btn.parentElement.insertBefore(span, btn);
                btn.textContent = '计时中...';
                activeTimer = setInterval(() => {
                    sec++;
                    span.innerText = `${sec}秒`;
                }, 1000);
                let stop = () => {
                    if (activeTimer) {
                        clearInterval(activeTimer);
                        activeTimer = null;
                        todos[currentTodoId].time = (todos[currentTodoId].time || 0) + sec;
                        saveAll();
                        renderTodos();
                    }
                };
                btn.addEventListener('click', stop, { once: true });
            };
        });
        document.querySelectorAll('.completeTask').forEach(btn => {
            btn.onclick = () => {
                let idx = parseInt(btn.dataset.idx);
                todos[idx].completed = true;
                if (activeTimer && currentTodoId === idx) clearInterval(activeTimer);
                saveAll();
                renderTodos();
            };
        });
        document.querySelectorAll('.delTask').forEach(btn => {
            btn.onclick = () => {
                let idx = parseInt(btn.dataset.idx);
                todos.splice(idx, 1);
                if (activeTimer && currentTodoId === idx) clearInterval(activeTimer);
                saveAll();
                renderTodos();
            };
        });
    }

    let todoPieChart = null;
    function showTodoPie(start, end) {
        let filtered = todos.filter(t => t.createDate && t.createDate >= start && t.createDate <= end);
        let subjectSec = {};
        filtered.forEach(t => {
            let sub = t.subject;
            let sec = t.time || 0;
            subjectSec[sub] = (subjectSec[sub] || 0) + sec;
        });
        let labels = Object.keys(subjectSec);
        let data = labels.map(l => subjectSec[l] / 60);
        if (todoPieChart) todoPieChart.destroy();
        let ctx = document.getElementById('todoPieChart').getContext('2d');
        todoPieChart = new Chart(ctx, { type: 'pie', data: { labels, datasets: [{ data }] } });
    }

    // 错题本
    function renderMistakes() {
        let container = document.getElementById('mistakeList');
        container.innerHTML = mistakes.map((m, i) => `
            <div class="mistake-item">
                <div><b>${m.category}</b>: ${m.text.substring(0,80)}<br>原因: ${m.note}</div>
                <button class="delMistake" data-idx="${i}">删除</button>
            </div>
        `).join('');
        document.querySelectorAll('.delMistake').forEach(btn => {
            btn.onclick = () => {
                mistakes.splice(parseInt(btn.dataset.idx), 1);
                saveAll();
                renderMistakes();
            };
        });
    }

    async function doOCR(file) {
        let status = document.getElementById('ocrStatus');
        if (!status) { status = document.createElement('div'); status.className = 'small-note'; document.getElementById('ocrBtn').after(status); }
        status.innerText = '识别中...';
        try {
            let { data: { text } } = await Tesseract.recognize(file, 'chi_sim+eng');
            status.innerText = '识别完成';
            return text;
        } catch(e) {
            status.innerText = '识别失败';
            return '';
        }
    }

    // 成语
    function renderChengyu() {
        let search = document.getElementById('chengyuSearch').value.toLowerCase();
        let filtered = chengyuList.filter(c => c.word.includes(search) || c.meaning.includes(search));
        let container = document.getElementById('chengyuList');
        container.innerHTML = filtered.map((c, idx) => `
            <div class="chengyu-item">
                <div><b>${c.word}</b> - ${c.meaning}<br>复习 ${c.review} 次</div>
                <div class="row-flex">
                    <button class="searchNet" data-word="${c.word}">🔍 联网释义</button>
                    <button class="quizBtn" data-word="${c.word}" data-meaning="${c.meaning}" data-idx="${chengyuList.findIndex(cc=>cc.word===c.word)}">📝 测验</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.searchNet').forEach(btn => btn.onclick = () => window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(btn.dataset.word+' 成语')}`));
        document.querySelectorAll('.quizBtn').forEach(btn => btn.onclick = () => startQuiz(btn.dataset.word, btn.dataset.meaning, parseInt(btn.dataset.idx)));
    }
    window.filterChengyu = () => renderChengyu();

    function startQuiz(word, correct, idx) {
        let others = chengyuList.filter(c => c.word !== word && c.meaning !== correct).map(c => c.meaning);
        let distractors = others.slice(0,3);
        while (distractors.length < 3) distractors.push("无中生有");
        let options = [correct, ...distractors];
        for (let i = options.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random()*(i+1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        let modal = document.createElement('div');
        modal.className = 'quiz-modal';
        modal.innerHTML = `<div class="quiz-card"><h3>${word}</h3>${options.map((opt,i)=>`<div class="quiz-option" data-opt="${opt.replace(/"/g,'&quot;')}">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}<button id="closeQuiz">取消</button></div>`;
        document.body.appendChild(modal);
        modal.querySelectorAll('.quiz-option').forEach(div => {
            div.onclick = () => {
                if (div.dataset.opt === correct) {
                    chengyuList[idx].review++;
                    saveAll();
                    renderChengyu();
                    alert('✅ 正确！背诵次数+1');
                } else {
                    alert(`❌ 错误！正确答案：${correct}`);
                }
                modal.remove();
            };
        });
        modal.querySelector('#closeQuiz').onclick = () => modal.remove();
    }

    // 模块统计
    function renderModuleOverview() {
        let stats = {};
        MODULES.forEach(m => stats[m] = { c:0, t:0 });
        modulesData.forEach(day => {
            MODULES.forEach(mod => {
                let rec = day[mod];
                if (rec && rec.t) {
                    stats[mod].c += rec.c;
                    stats[mod].t += rec.t;
                }
            });
        });
        let container = document.getElementById('moduleOverview');
        container.innerHTML = MODULES.map(mod => {
            let acc = stats[mod].t ? (stats[mod].c/stats[mod].t*100).toFixed(1) : '--';
            return `<div class="small-note"><strong>${mod}</strong> ${acc}% (${stats[mod].t}题)</div>`;
        }).join('');
    }

    let moduleLineChart = null;
    function renderModuleLineChart() {
        if (!modulesData.length) return;
        let sorted = [...modulesData].sort((a,b)=>new Date(a.date)-new Date(b.date));
        let labels = sorted.map(d => d.date.slice(5));
        let datasets = MODULES.map((mod, i) => {
            let data = sorted.map(day => day[mod] && day[mod].t ? (day[mod].c/day[mod].t*100).toFixed(1) : null);
            let colors = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec489a'];
            return { label: mod, data, borderColor: colors[i], tension: 0.2, fill: false };
        });
        let ctx = document.getElementById('moduleLineChart').getContext('2d');
        if (moduleLineChart) moduleLineChart.destroy();
        moduleLineChart = new Chart(ctx, { type: 'line', data: { labels, datasets } });
    }

    let modulePieChart = null;
    function showModulePie(start, end) {
        let filtered = modulesData.filter(d => d.date >= start && d.date <= end);
        let totalByMod = {};
        MODULES.forEach(m => totalByMod[m] = 0);
        filtered.forEach(day => {
            MODULES.forEach(mod => {
                let rec = day[mod];
                if (rec && rec.t) totalByMod[mod] += rec.t;
            });
        });
        let labels = MODULES.filter(m => totalByMod[m] > 0);
        let data = labels.map(m => totalByMod[m]);
        if (modulePieChart) modulePieChart.destroy();
        let ctx = document.getElementById('modulePieChart').getContext('2d');
        modulePieChart = new Chart(ctx, { type: 'pie', data: { labels, datasets: [{ data }] } });
    }

    function showModuleInput() {
        let area = document.getElementById('moduleInputArea');
        area.innerHTML = `<div class="row-flex"><strong>填写今日各模块数据</strong><button id="hideModuleInput">取消</button></div>
            ${MODULES.map(mod => `<div><strong>${mod}</strong></div><div class="row-flex"><input type="number" id="mod_c_${mod}" placeholder="正确数" style="width:100px"><input type="number" id="mod_t_${mod}" placeholder="总题数" style="width:100px"></div>`).join('')}
            <button id="submitModuleData">保存</button>`;
        area.style.display = 'block';
        document.getElementById('hideModuleInput').onclick = () => area.style.display = 'none';
        document.getElementById('submitModuleData').onclick = () => {
            let date = document.getElementById('moduleDate').value;
            if (!date) { alert('请选择日期'); return; }
            let record = { date };
            let hasAny = false;
            for (let mod of MODULES) {
                let c = parseInt(document.getElementById(`mod_c_${mod}`).value) || 0;
                let t = parseInt(document.getElementById(`mod_t_${mod}`).value) || 0;
                if (t) hasAny = true;
                if (t === 0 && c > 0) { alert(`${mod} 总题数不能为0`); return; }
                record[mod] = { c, t };
            }
            if (!hasAny) { alert('至少一个模块有数据'); return; }
            let idx = modulesData.findIndex(d => d.date === date);
            if (idx !== -1) modulesData[idx] = record;
            else modulesData.push(record);
            saveAll();
            renderModuleOverview();
            renderModuleLineChart();
            area.style.display = 'none';
            alert('已保存');
        };
    }

    // 倒计时 & 申论
    function renderCountdowns() {
        let container = document.getElementById('countdownList');
        let today = new Date(); today.setHours(0,0,0,0);
        container.innerHTML = countdowns.map((cd, idx) => {
            let target = new Date(cd.date);
            let diff = Math.ceil((target - today) / 86400000);
            let status = diff >= 0 ? `还有${diff}天` : `已过${-diff}天`;
            return `<div class="task-item"><strong>${cd.name}</strong> ${cd.date} · ${status}<button class="delCount" data-idx="${idx}">删除</button></div>`;
        }).join('');
        document.querySelectorAll('.delCount').forEach(btn => btn.onclick = () => {
            countdowns.splice(parseInt(btn.dataset.idx),1);
            saveAll();
            renderCountdowns();
        });
    }

    function loadCourses() {
        let html = '<strong>课程推荐</strong><ul><li>粉笔980</li><li>花生十三资料</li><li>龙飞图推</li></ul>';
        document.getElementById('courseList').innerHTML = html;
    }

    // 辅助日期范围
    function getDateRange(type) {
        let today = new Date();
        if (type === 'today') { let s = today.toISOString().slice(0,10); return { start: s, end: s }; }
        if (type === 'week') {
            let day = today.getDay();
            let diff = day === 0 ? 6 : day-1;
            let mon = new Date(today.getTime() - diff*86400000);
            let sun = new Date(mon.getTime() + 6*86400000);
            return { start: mon.toISOString().slice(0,10), end: sun.toISOString().slice(0,10) };
        }
        if (type === 'month') {
            let start = new Date(today.getFullYear(), today.getMonth(), 1);
            let end = new Date(today.getFullYear(), today.getMonth()+1, 0);
            return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
        }
        return null;
    }

    function initAll() {
        loadData();
        updateExamUI();
        renderTodos();
        renderMistakes();
        renderChengyu();
        renderModuleOverview();
        renderModuleLineChart();
        renderCountdowns();
        loadCourses();

        document.getElementById('showSubForm').onclick = showSubForm;
        document.getElementById('hideSubForm').onclick = () => document.getElementById('subForm').style.display = 'none';
        document.getElementById('addTask').onclick = () => {
            let name = document.getElementById('taskName').value.trim();
            if (!name) return alert('请输入任务名');
            todos.push({ name, subject: document.getElementById('taskSubject').value, completed: false, time: 0, createDate: new Date().toISOString().slice(0,10) });
            saveAll();
            renderTodos();
            document.getElementById('taskName').value = '';
        };
        document.getElementById('ocrBtn').onclick = async () => {
            let file = document.getElementById('mistakePhoto').files[0];
            if (!file) { alert('请选择图片'); return; }
            let text = await doOCR(file);
            document.getElementById('ocrText').value = text;
        };
        document.getElementById('addMistake').onclick = () => {
            let text = document.getElementById('ocrText').value.trim();
            if (!text) return alert('请输入题目');
            mistakes.unshift({ text, category: document.getElementById('mistakeCategory').value, note: document.getElementById('mistakeNote').value.trim() || '无' });
            saveAll();
            renderMistakes();
            document.getElementById('ocrText').value = '';
            document.getElementById('mistakeNote').value = '';
        };
        document.getElementById('addChengyu').onclick = () => {
            let w = document.getElementById('newWord').value.trim();
            let m = document.getElementById('newMeaning').value.trim();
            if (!w || !m) return alert('填写完整');
            chengyuList.push({ word: w, meaning: m, review: 0 });
            saveAll();
            renderChengyu();
            document.getElementById('newWord').value = '';
            document.getElementById('newMeaning').value = '';
        };
        document.getElementById('addCountdown').onclick = () => {
            let name = document.getElementById('examNameInput').value.trim();
            let date = document.getElementById('examDate').value;
            if (!name || !date) return alert('填写完整');
            countdowns.push({ name, date });
            saveAll();
            renderCountdowns();
        };
        document.getElementById('compareAnswer').onclick = () => {
            let my = document.getElementById('myAnswer').value;
            let ref = document.getElementById('refAnswer').value;
            if (my === ref) document.getElementById('compareResult').innerHTML = '✅ 完全一致';
            else document.getElementById('compareResult').innerHTML = '📌 不一致，请对照要点修改';
        };
        document.getElementById('recordModule').onclick = showModuleInput;
        document.getElementById('todoToday').onclick = () => { let r = getDateRange('today'); if(r) showTodoPie(r.start, r.end); };
        document.getElementById('todoWeek').onclick = () => { let r = getDateRange('week'); if(r) showTodoPie(r.start, r.end); };
        document.getElementById('todoMonth').onclick = () => { let r = getDateRange('month'); if(r) showTodoPie(r.start, r.end); };
        document.getElementById('moduleToday').onclick = () => { let r = getDateRange('today'); if(r) showModulePie(r.start, r.end); };
        document.getElementById('moduleWeek').onclick = () => { let r = getDateRange('week'); if(r) showModulePie(r.start, r.end); };
        document.getElementById('moduleMonth').onclick = () => { let r = getDateRange('month'); if(r) showModulePie(r.start, r.end); };

        // 选项卡切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                let panelId = btn.dataset.panel + 'Panel';
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById(panelId).classList.add('active');
            };
        });
        // 默认显示今日饼图
        let todayRange = getDateRange('today');
        if (todayRange) showTodoPie(todayRange.start, todayRange.end);
        if (todayRange) showModulePie(todayRange.start, todayRange.end);
    }
</script>
</body>
